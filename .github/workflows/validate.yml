name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m scenemeta.validate
      - run: python3 -m unittest tests.test_merge tests.test_validate tests.core.test_corpus tests.amiga.test_corpus
