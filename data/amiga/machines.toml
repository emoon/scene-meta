# Amiga machine presets. An entry names one with `machine` and may override
# single fields on top of it. Sizes are K or M; drives is the number of floppy
# drives.

default = "a500"

[a500]
description = "A500, 512K chip + 512K slow"
cpu = "68000"
chipset = "ocs"
kickstart = "1.3"
chip = "512K"
drives = 1
slow = "512K"

[a500_1mb]
description = "A500 with ECS Agnus, 1M chip + 512K slow"
cpu = "68000"
chipset = "ecs_agnus"
kickstart = "1.3"
chip = "1M"
drives = 1
slow = "512K"

# Demos of the Kickstart 1.2 era hard-code ROM addresses and guru under 1.3.
[a500_ks12]
description = "A500 with Kickstart 1.2, 512K chip + 512K slow"
cpu = "68000"
chipset = "ocs"
kickstart = "1.2"
chip = "512K"
drives = 1
slow = "512K"

# Some intros only run when AmigaDOS loads them into chip RAM.
[a500_512k]
description = "A500 with no trapdoor RAM, 512K chip"
cpu = "68000"
chipset = "ocs"
kickstart = "1.3"
chip = "512K"
drives = 1

# Some demos reboot themselves and Guru during the boot when slow RAM is there.
[a500_1mb_chip]
description = "A500 with ECS Agnus, 1M chip, no trapdoor RAM"
cpu = "68000"
chipset = "ecs_agnus"
kickstart = "1.3"
chip = "1M"
drives = 1

# Needs 2M chip and does not run on a 68EC020, AGA or Kickstart 3.0.
[a500_2mb_chip]
description = "A500 with ECS Agnus, 2M chip, no trapdoor RAM"
cpu = "68000"
chipset = "ecs_agnus"
kickstart = "1.3"
chip = "2M"
drives = 1

[a1200]
description = "A1200, 2M chip"
cpu = "68ec020"
chipset = "aga"
kickstart = "3.0"
chip = "2M"
drives = 1

[a1200_fast]
description = "A1200 with 8M fast"
cpu = "68020"
chipset = "aga"
kickstart = "3.0"
chip = "2M"
drives = 1
fast = "8M"

[a1200_030]
description = "A1200 with 68030 + 68882, 32M fast"
cpu = "68030"
fpu = "68882"
chipset = "aga"
kickstart = "3.0"
chip = "2M"
drives = 1
fast = "32M"

[a1200_060]
description = "A1200 with 68060, 64M fast"
cpu = "68060"
fpu = "68060"
chipset = "aga"
kickstart = "3.0"
chip = "2M"
drives = 1
fast = "64M"
